services:
  postgres:
    image: postgres:16-alpine
    container_name: sidesa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sidesa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidesa_password}
      POSTGRES_DB: ${POSTGRES_DB:-sidesa_db}
    volumes:
      - sidesa_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidesa_user -d sidesa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sidesa_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18022}:80"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sidesa_user}:${POSTGRES_PASSWORD:-sidesa_password}@postgres:5432/${POSTGRES_DB:-sidesa_db}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-}
      WAHA_SESSION: ${WAHA_SESSION:-}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      RENEO_PANEL_URL: ${RENEO_PANEL_URL:-}
      DATA_DIR: /app/data
    volumes:
      - sidesa_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sidesa_postgres_data:
  sidesa_data:
